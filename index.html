<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOAK · A BATHHOUSE — A full-spectrum wellness experience in Birmingham, Alabama">
  <meta property="og:image" content="assets/images/logo/SoakFish.png">
  <title>SOAK · A Bathhouse</title>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ========== NAV ========== -->
  <header class="site-header" id="site-header">
    <nav class="nav" id="nav">
      <ul class="nav__left">
        <li><a href="#booking-cta" class="font-subheader nav__link">Book</a></li>
        <li><a href="#explore" class="font-subheader nav__link">About</a></li>
      </ul>

      <div class="nav__center" aria-hidden="true">
        <span class="nav__dot"></span>
      </div>

      <ul class="nav__right">
        <li><a href="#site-footer" class="font-subheader nav__link">Contact</a></li>
        <li><a href="#" class="font-subheader nav__link">Cart</a></li>
      </ul>

      <button class="nav__burger" id="nav-burger" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- Mobile overlay -->
    <div class="nav__overlay" id="nav-overlay">
      <ul class="nav__overlay-links">
        <li><a href="#booking-cta" class="font-subheader nav__overlay-link">Book</a></li>
        <li><a href="#explore" class="font-subheader nav__overlay-link">About</a></li>
        <li><a href="#site-footer" class="font-subheader nav__overlay-link">Contact</a></li>
        <li><a href="#" class="font-subheader nav__overlay-link">Cart</a></li>
      </ul>
    </div>
  </header>

  <!-- ========== HERO ========== -->
  <section id="hero" class="hero">
    <div class="hero__photo">
      <img src="assets/images/photography/Soak.jpg" alt="Green marble soaking tub at SOAK Bathhouse">
    </div>
    <div class="hero__pattern">
      <img src="assets/images/patterns/WaveShapeSediment.svg" alt="" class="hero__pattern-img" aria-hidden="true">
    </div>
    <img src="assets/images/logo/LeftJustifiedsediment.svg" alt="SOAK · A Bathhouse" class="hero__logo">
  </section>
  <!-- ========== TAGLINE ========== -->
  <section id="tagline" class="tagline">
    <div class="tagline__brand-bar">
      <img src="assets/images/logo/SoakABHSmallsediment.svg" alt="SOAK · A Bathhouse" class="tagline__brand-logo">
    </div>

    <div class="tagline__icons">
      <div class="tagline__item">
        <img src="assets/images/icons/AtmosphereSediment.svg" alt="" class="tagline__icon">
        <span class="font-header tagline__word">One</span>
      </div>
      <div class="tagline__item">
        <img src="assets/images/icons/EyeSediment.svg" alt="" class="tagline__icon">
        <span class="font-header tagline__word">Soak</span>
      </div>
      <div class="tagline__item">
        <img src="assets/images/icons/AmphoraSediment.svg" alt="" class="tagline__icon">
        <span class="font-header tagline__word">At A</span>
      </div>
      <div class="tagline__item">
        <img src="assets/images/icons/ChoppyWavessediment.svg" alt="" class="tagline__icon">
        <span class="font-header tagline__word">Time.</span>
      </div>
    </div>
  </section>
  <section id="booking-cta"></section>
  <section id="cards"></section>
  <section id="explore"></section>
  <section id="mosaic"></section>
  <footer id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
